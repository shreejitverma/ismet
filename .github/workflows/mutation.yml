name: Mutation check

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    name: Every committed mutant is killed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # 3.10: the asyncio cancellation mutant can only be killed before 3.12.
          python-version: "3.10"
      - name: Install
        run: python -m pip install --upgrade pip && pip install .[dev]
      - name: Run the catalogue
        run: python scripts/mutation_check.py
