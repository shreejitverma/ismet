version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must move together; one PR each leaves them on two
      # versions, which CodeQL refuses.
      codeql:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: uv
    directory: /
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
