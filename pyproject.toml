[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isme"
version = "0.1.0"
description = "International Stock Market Engine: A unified Python package to connect to major stock exchanges."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["stock-market", "trading", "finance", "nyse", "nasdaq", "nse", "bse", "lse"]
authors = [
  { name = "Shreejit Verma" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27.0",
  "websockets>=12.0",
  "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/shreejitverma/isme"
Issues = "https://github.com/shreejitverma/isme/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/isme"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RET"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
