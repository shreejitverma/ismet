# Mutants of the safety-critical code, run by scripts/mutation_check.py.
#
# Each entry replaces one exact snippet, which must occur once in `file`, with a
# plausible bug, and names the tests that must fail with it applied. `risk` says
# what a survivor would mean. A mutant that cannot change behaviour gets an
# `equivalent` reason instead of being deleted, so the decision stays visible.
# A mutant that can only be killed on older interpreters gets `before_python`, the
# first version (MAJOR.MINOR) it does not apply to; there it is reported, not run.
# Hand-picked mutants show the named risks are covered, not that all behaviour is.

